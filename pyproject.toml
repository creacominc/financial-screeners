[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-screeners"
version = "0.1.0"
description = "Separate UK gilt, US Treasury, USD corporate bond and FTSE equity screening tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "holidays>=0.60,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
us-corporate-fetch-public = "us_corporate_analyser.public_fetcher:main"
us-corporate-analyser = "us_corporate_analyser.cli:main"
ftse-fetch-hl = "ftse_screener.hl:main"
ftse-screener = "ftse_screener.cli:main"
gilt-analyser = "gilt_analyser.cli:main"
gilt-fetch-hl = "gilt_analyser.hl_scraper:main"
us-treasury-analyser = "us_treasury_analyser.cli:main"
us-treasury-fetch-wsj = "us_treasury_analyser.wsj_fetcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
