name: Run FTSE comparison

on:
  workflow_dispatch:
    inputs:
      input_json:
        description: Configuration path (default fetches real FTSE350 data)
        type: string
        default: config/ftse_live.json
        required: true
      fetch_hl:
        description: Refresh HL public data (real configurations only; demo stays offline)
        type: boolean
        default: true
      monthly_per_share:
        description: Optional GBP amount PER SHARE for affordability estimates (not total budget)
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-ftse-screening.yml'
      - 'src/ftse_screener/**'
      - 'config/ftse_live.json'
  schedule:
    # UTC year-round; Python uses Europe/London for weekly/monthly decisions.
    - cron: '15 7 * * *'

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Validate configuration and select report date
        id: config
        env:
          INPUT_PATH: ${{ inputs.input_json || vars.FTSE_INPUT_JSON || 'config/ftse_live.json' }}
          EVENT: ${{ github.event_name }}
          FETCH_HL: ${{ inputs.fetch_hl || github.event_name != 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from ftse_screener.automation import report_reason, refresh_mode
          if not os.environ['INPUT_PATH']:
              raise SystemExit('Set FTSE_INPUT_JSON to a real configuration to enable scheduled reports; no refresh performed')
          root = Path.cwd().resolve()
          source = (root / os.environ['INPUT_PATH']).resolve()
          if root not in source.parents or not source.is_file():
              raise SystemExit('Input must be a file inside the repository')
          data = json.loads(source.read_text())
          mode = refresh_mode(data, os.environ['EVENT'], os.environ['FETCH_HL'] == 'true')
          if mode == 'illustrative' and os.environ['FETCH_HL'] == 'true':
              print('::warning::Illustrative input selected: HL refresh skipped. Demo reports only; select examples/ftse_config.json with HL refresh for live discovery.')
          now = datetime.now(timezone.utc)
          monthly_cutoff = None
          if os.environ['EVENT'] == 'schedule' and now.weekday() != 0 and data['policy'].get('baseline_policy') == 'hl-public-v1':
              from ftse_screener.hl import fetch
              from ftse_screener.execution import parse_terms, next_cutoff, fetch_holidays, TERMS_URL
              monthly_cutoff = next_cutoff(now.date(),parse_terms(fetch(TERMS_URL),now.date()),fetch_holidays())
          reason = 'manual' if os.environ['EVENT'] == 'workflow_dispatch' else ('push validation' if os.environ['EVENT'] == 'push' else report_reason(data, now, monthly_cutoff))
          Path('reports').mkdir(exist_ok=True)
          shutil.copyfile(source, 'reports/ftse_input.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run={'true' if reason else 'false'}\n")
              out.write(f"refresh={'true' if mode == 'hl' else 'false'}\n")
              out.write(f"date={now.astimezone(ZoneInfo('Europe/London')).date()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"FTSE report: {reason or 'not due today'}. Input: {source.name}. Mode: {mode}.\n")
          PY
      - name: Cache public HL pages by freshness policy
        if: steps.config.outputs.run == 'true' && steps.config.outputs.refresh == 'true'
        uses: actions/cache@v5
        with:
          path: reports/hl-cache
          key: ftse-hl-v2-${{ runner.os }}-${{ steps.config.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ftse-hl-v2-${{ runner.os }}-
      - name: Refresh HL public data
        if: steps.config.outputs.run == 'true' && steps.config.outputs.refresh == 'true'
        run: ftse-fetch-hl reports/ftse_input.json reports/ftse_refreshed.json --discover-universe --full-metrics --cache-dir reports/hl-cache
      - name: Generate dated reports
        if: steps.config.outputs.run == 'true'
        env:
          AS_OF: ${{ steps.config.outputs.date }}
          MONTHLY_PER_SHARE: ${{ inputs.monthly_per_share }}
        run: |
          input=reports/ftse_input.json
          if [ -f reports/ftse_refreshed.json ]; then input=reports/ftse_refreshed.json; fi
          args=()
          if [ -n "$MONTHLY_PER_SHARE" ]; then args+=(--monthly-per-share "$MONTHLY_PER_SHARE"); fi
          ftse-screener "$input" --as-of "$AS_OF" --output "reports/ftse-comparison-$AS_OF" "${args[@]}"
          cat "reports/ftse-comparison-$AS_OF.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Flag failure
        if: failure()
        run: echo 'FTSE run FAILED or incomplete. No current recommendations should be inferred from earlier artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always() && steps.config.outputs.run == 'true'
        with:
          name: ftse-comparison-${{ steps.config.outputs.date }}-${{ github.run_id }}
          path: reports/ftse*
          retention-days: 30
          if-no-files-found: warn
