name: Run FTSE screening

on:
  workflow_dispatch:
    inputs:
      input_json:
        description: Repository configuration path (illustrative default does not fetch)
        type: string
        default: examples/ftse_snapshot.json
        required: true
      fetch_hl:
        description: Refresh HL public data (real configurations only; demo stays offline)
        type: boolean
        default: false
  schedule:
    # UTC year-round; Python uses Europe/London for weekly/monthly decisions.
    - cron: '15 7 * * *'

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Validate configuration and select report date
        id: config
        env:
          INPUT_PATH: ${{ inputs.input_json || vars.FTSE_INPUT_JSON }}
          EVENT: ${{ github.event_name }}
          FETCH_HL: ${{ inputs.fetch_hl }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from ftse_screener.automation import report_reason, refresh_mode
          if not os.environ['INPUT_PATH']:
              raise SystemExit('Set FTSE_INPUT_JSON to a real configuration to enable scheduled reports; no refresh performed')
          root = Path.cwd().resolve()
          source = (root / os.environ['INPUT_PATH']).resolve()
          if root not in source.parents or not source.is_file():
              raise SystemExit('Input must be a file inside the repository')
          data = json.loads(source.read_text())
          mode = refresh_mode(data, os.environ['EVENT'], os.environ['FETCH_HL'] == 'true')
          if mode == 'illustrative' and os.environ['FETCH_HL'] == 'true':
              print('::warning::Illustrative input selected: HL refresh skipped. Demo reports only; select examples/ftse_config.json with HL refresh for live discovery.')
          now = datetime.now(timezone.utc)
          reason = 'manual' if os.environ['EVENT'] == 'workflow_dispatch' else report_reason(data, now)
          Path('reports').mkdir(exist_ok=True)
          shutil.copyfile(source, 'reports/ftse_input.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"run={'true' if reason else 'false'}\n")
              out.write(f"refresh={'true' if mode == 'hl' else 'false'}\n")
              out.write(f"date={now.astimezone(ZoneInfo('Europe/London')).date()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"FTSE report: {reason or 'not due today'}. Input: {source.name}. Mode: {mode}.\n")
          PY
      - name: Refresh HL public data
        if: steps.config.outputs.run == 'true' && steps.config.outputs.refresh == 'true'
        run: ftse-fetch-hl reports/ftse_input.json reports/ftse_refreshed.json --discover-universe
      - name: Generate dated reports
        if: steps.config.outputs.run == 'true'
        env:
          AS_OF: ${{ steps.config.outputs.date }}
        run: |
          input=reports/ftse_input.json
          if [ -f reports/ftse_refreshed.json ]; then input=reports/ftse_refreshed.json; fi
          ftse-screener "$input" --as-of "$AS_OF" --output "reports/ftse-$AS_OF"
          cat "reports/ftse-$AS_OF.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Flag failure
        if: failure()
        run: echo 'FTSE run FAILED or incomplete. No current recommendations should be inferred from earlier artifacts.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always() && steps.config.outputs.run == 'true'
        with:
          name: ftse-reports-${{ steps.config.outputs.date }}-${{ github.run_id }}
          path: reports/ftse*
          retention-days: 30
          if-no-files-found: warn
