name: Run gilt analysis

on:
  workflow_dispatch:
    inputs:
      investment:
        description: Investment amount in GBP (per gilt)
        required: true
        default: "5000"
        type: string
      fee:
        description: HL dealing fee in GBP
        required: true
        default: "11.95"
        type: string
      settlement_date:
        description: Settlement date (YYYY-MM-DD)
        required: true
        default: "2026-07-22"
        type: string
      input_csv:
        description: Input CSV path in this repository
        required: true
        default: examples/gilts.csv
        type: string

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate input CSV path
        env:
          INPUT_CSV: ${{ inputs.input_csv }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          repository = Path.cwd().resolve()
          input_csv = (repository / os.environ["INPUT_CSV"]).resolve()
          if repository not in input_csv.parents:
              raise SystemExit("Input CSV must be inside the repository")
          if not input_csv.is_file():
              raise SystemExit(f"Input CSV does not exist: {input_csv}")
          PY

      - name: Generate reports
        env:
          INPUT_CSV: ${{ inputs.input_csv }}
          INVESTMENT: ${{ inputs.investment }}
          FEE: ${{ inputs.fee }}
          SETTLEMENT_DATE: ${{ inputs.settlement_date }}
        run: |
          mkdir -p reports
          gilt-analyser "$INPUT_CSV" \
            --investment "$INVESTMENT" \
            --fee "$FEE" \
            --settlement-date "$SETTLEMENT_DATE" \
            --output "reports/gilt-comparison-$SETTLEMENT_DATE"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: gilt-reports-${{ inputs.settlement_date }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
