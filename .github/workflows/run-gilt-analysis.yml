name: Run gilt comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-gilt-analysis.yml'
      - 'src/gilt_analyser/**'
      - 'tests/test_calculator.py'
      - 'tests/test_schedule.py'
      - 'tests/test_reporting.py'
      - 'tests/test_hl_scraper.py'
      - 'tests/test_bond_summary.py'
      - 'tests/test_workflow_dates.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      investment:
        description: Investment amount in GBP (per gilt)
        required: true
        default: "5000"
        type: string
      fee:
        description: HL dealing fee in GBP
        required: true
        default: "11.95"
        type: string
      settlement_date:
        description: Settlement date (YYYY-MM-DD)
        required: true
        type: string
      input_csv:
        description: Input CSV path in this repository
        required: true
        default: examples/gilts.csv
        type: string
      price_source:
        description: Price data source
        required: true
        default: "Fetch current HL buy prices"
        type: choice
        options:
          - Fetch current HL buy prices
          - Use repository CSV

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Select calculation date
        env:
          REQUESTED_DATE: ${{ inputs.settlement_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          calculation_date = date.fromisoformat(os.environ['REQUESTED_DATE']) if os.environ['REQUESTED_DATE'] else datetime.now(ZoneInfo('Europe/London')).date()
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'COMPARISON_DATE={calculation_date.isoformat()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(f'Calculation date: {calculation_date}. Automatic runs use the London calendar date, not a broker-confirmed settlement date.\n')
          PY

      - name: Validate input CSV path
        if: inputs.price_source == 'Use repository CSV'
        env:
          INPUT_CSV: ${{ inputs.input_csv }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          repository = Path.cwd().resolve()
          input_csv = (repository / os.environ["INPUT_CSV"]).resolve()
          if repository not in input_csv.parents:
              raise SystemExit("Input CSV must be inside the repository")
          if not input_csv.is_file():
              raise SystemExit(f"Input CSV does not exist: {input_csv}")
          PY

      - name: Fetch current HL prices
        if: github.event_name == 'push' || inputs.price_source == 'Fetch current HL buy prices'
        run: gilt-fetch-hl reports/hl-current-gilts.csv --as-of "${{ env.COMPARISON_DATE }}" --months 24

      - name: Generate reports
        env:
          INPUT_CSV: ${{ (github.event_name == 'push' || inputs.price_source == 'Fetch current HL buy prices') && 'reports/hl-current-gilts.csv' || inputs.input_csv }}
          INVESTMENT: ${{ inputs.investment || '5000' }}
          FEE: ${{ inputs.fee || '11.95' }}
          SETTLEMENT_DATE: ${{ env.COMPARISON_DATE }}
        run: |
          mkdir -p reports
          gilt-analyser "$INPUT_CSV" \
            --investment "$INVESTMENT" \
            --fee "$FEE" \
            --settlement-date "$SETTLEMENT_DATE" \
            --output "reports/gilt-comparison-$SETTLEMENT_DATE"

      - name: Publish top 50 screening summary
        env:
          SETTLEMENT_DATE: ${{ env.COMPARISON_DATE }}
        run: cat "reports/gilt-comparison-$SETTLEMENT_DATE.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo "Gilt analysis failed. No current selections were produced; see the job logs." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: gilt-comparison-${{ env.COMPARISON_DATE }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest CSV to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-reports >/dev/null 2>&1 || gh release create latest-reports --title 'Latest Reports' --notes 'Latest screening CSV reports'
          cp "reports/gilt-comparison-${{ env.COMPARISON_DATE }}.csv" "$RUNNER_TEMP/gilts-latest.csv"
          gh release upload latest-reports "$RUNNER_TEMP/gilts-latest.csv" --clobber
