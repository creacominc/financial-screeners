name: Run US Treasury comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-us-treasury-analysis.yml'
      - 'src/us_treasury_analyser/**'
      - 'tests/test_us_treasuries.py'
      - 'tests/test_wsj_fetcher.py'
      - 'tests/test_bond_summary.py'
      - 'tests/test_workflow_dates.py'
      - 'pyproject.toml'
      - 'src/gilt_analyser/cli.py'
      - 'src/gilt_analyser/summary.py'
  workflow_dispatch:
    inputs:
      investment:
        description: Investment budget in USD per Treasury
        required: true
        default: "5000"
        type: string
      fee:
        description: Dealing fee in USD
        required: true
        default: "0"
        type: string
      settlement_date:
        description: Settlement date (YYYY-MM-DD); blank selects next trading day
        required: false
        default: ''
        type: string
      input_csv:
        description: Repository CSV path (used only for supplied quotes)
        required: true
        default: examples/us_treasuries.csv
        type: string
      price_source:
        description: Price data source
        required: true
        default: Fetch current WSJ indicative quotes
        type: choice
        options:
          - Fetch current WSJ indicative quotes
          - Use repository CSV
      months:
        description: Maturity window in calendar months for fetched quotes
        required: true
        default: "24"
        type: string

permissions:
  contents: write

jobs:
  analyse:
    concurrency:
      group: latest-financial-reports-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run all tests
        run: pytest
      - name: Select calculation date
        env:
          REQUESTED_DATE: ${{ inputs.settlement_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from gilt_analyser.trading_dates import next_trading_day
          from zoneinfo import ZoneInfo
          calculation_date = date.fromisoformat(os.environ['REQUESTED_DATE']) if os.environ['REQUESTED_DATE'] else next_trading_day(datetime.now(ZoneInfo('Europe/London')).date(), 'US')
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'COMPARISON_DATE={calculation_date.isoformat()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(f'Calculation date: {calculation_date}. Default uses the next market trading day; this is not a broker-confirmed settlement date.\n')
          PY

      - name: Validate and snapshot input
        if: inputs.price_source == 'Use repository CSV'
        env:
          INPUT_CSV: ${{ inputs.input_csv }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          repository = Path.cwd().resolve()
          source = (repository / os.environ['INPUT_CSV']).resolve()
          if repository not in source.parents or not source.is_file():
              raise SystemExit('Input CSV must be an existing file inside the repository')
          Path('reports').mkdir(exist_ok=True)
          shutil.copyfile(source, 'reports/us_treasuries_input.csv')
          PY
      - name: Generate US Treasury reports
        env:
          INVESTMENT: ${{ inputs.investment || '5000' }}
          FEE: ${{ inputs.fee || '0' }}
          SETTLEMENT_DATE: ${{ env.COMPARISON_DATE }}
          PRICE_SOURCE: ${{ inputs.price_source || 'Fetch current WSJ indicative quotes' }}
          MONTHS: ${{ inputs.months || '24' }}
        run: |
          if [ "$PRICE_SOURCE" = "Use repository CSV" ]; then
            us-treasury-analyser reports/us_treasuries_input.csv \
              --investment "$INVESTMENT" --fee "$FEE" \
              --settlement-date "$SETTLEMENT_DATE" --skip-unaffordable --output "reports/us-treasury-comparison-$SETTLEMENT_DATE"
          else
            us-treasury-analyser --fetch-wsj --months "$MONTHS" \
              --investment "$INVESTMENT" --fee "$FEE" \
              --settlement-date "$SETTLEMENT_DATE" --skip-unaffordable --output "reports/us-treasury-comparison-$SETTLEMENT_DATE"
          fi
      - name: Publish top 50 screening summary
        run: cat "reports/us-treasury-comparison-${{ env.COMPARISON_DATE }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        run: echo "US Treasury analysis failed. No current selections were produced; see the job logs." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: us-treasury-comparison-${{ env.COMPARISON_DATE }}
          path: |
            reports/us-treasury-comparison-*
            reports/us_treasuries_input.csv
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest CSV to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-reports >/dev/null 2>&1 || gh release create latest-reports --title 'Latest Reports' --notes 'Latest screening CSV reports'
          cp "reports/us-treasury-comparison-${{ env.COMPARISON_DATE }}.csv" "$RUNNER_TEMP/us-treasuries-latest.csv"
          gh release upload latest-reports "$RUNNER_TEMP/us-treasuries-latest.csv" --clobber
